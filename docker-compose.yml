version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: campus-os-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: campus_os
    ports:
      - "5432:5432"
    volumes:
      - campus-os-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campus_os"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  campus-os-postgres-data:
    external: true
